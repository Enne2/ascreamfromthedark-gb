site_name: A Scream from the Dark
site_description: Survival-horror procedurale isometrico per Game Boy (DMG/CGB) — documentazione tecnica
site_url: https://enne2.github.io/ascreamfromthedark-gb/
repo_url: https://github.com/Enne2/ascreamfromthedark-gb
repo_name: ascreamfromthedark-gb
edit_uri: edit/main/docs/

theme:
  name: material
  language: it
  palette:
    scheme: slate
    primary: deep purple
    accent: purple
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed

nav:
  - Gioca (demo wasmboy): demo/index.html
  - Home: index.md
  - Architettura: architecture.md
  - Grafica e Rendering: graphics.md
  - Generazione del Livello: generation.md
  - Gameplay: gameplay.md
  - AI (Fantasmi): ai.md
  - Audio: audio.md
  - Storico:
      - Report tecnico (giu 2026): AScreamFromTheDark_report.md
      - Audit codice e target (2026-07-30): audit_target_report_2026-07-30.md
      - Audit tiling pavimento (2026-07-30): floor_tiling_audit_2026-07-30.md
      - Ottimizzazione tiling (2026-08-08): tiling_optimization_validation_2026-08-08.md
      - Consolidamento release (2026-08-08): release_hardening_2026-08-08.md
